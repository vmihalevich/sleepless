# XcodeGen spec; the .xcodeproj is generated by Scripts/build.sh and not committed.
# Signing happens in Scripts/build.sh with each target's entitlements, so Xcode builds unsigned.

name: Sleepless

options:
  bundleIdPrefix: dev.mihalevich
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "2"
    CODE_SIGNING_ALLOWED: NO
    ENABLE_HARDENED_RUNTIME: YES
    GENERATE_INFOPLIST_FILE: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  Sleepless:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/Sleepless
      - path: Sources/Shared
      - path: Resources
        excludes:
          - Info.plist
          - Sleepless.entitlements
        buildPhase: resources
    dependencies:
      - target: SleeplessControl
    settings:
      base:
        INFOPLIST_FILE: Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: dev.mihalevich.sleepless

  # Control Center switch. WidgetKit extensions must be sandboxed; see SetSleeplessIntent.
  # AppIntents is a direct dependency: without it the intent's metadata isn't extracted and the
  # system never shows the switch.
  SleeplessControl:
    type: app-extension
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Control
        excludes:
          - Info.plist
          - SleeplessControl.entitlements
      - path: Sources/Shared
      - path: Resources
        includes:
          - "*.lproj/Localizable.strings"
        buildPhase: resources
    dependencies:
      - sdk: AppIntents.framework
    settings:
      base:
        INFOPLIST_FILE: Control/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: dev.mihalevich.sleepless.control
        PRODUCT_NAME: SleeplessControl
        SKIP_INSTALL: YES
