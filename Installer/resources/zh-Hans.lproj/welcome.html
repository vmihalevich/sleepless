<p>只需一键，Sleepless 就能让你的 MacBook 在合上盖子后继续工作：屏幕熄灭，但音乐、下载、后台任务和远程连接都会照常运行！</p>
<p>此安装器会把 Sleepless 放入“应用程序”文件夹，并只允许它以管理员身份运行一条系统命令——就是控制 MacBook 睡眠设置的那一条。</p>
<p>只要你关闭开关、退出或关闭应用、重新启动 Mac，或者电池电量降到 10% 或以下，平常的睡眠设置就会立即恢复。</p>
<p>祝你使用愉快！</p>
