<html lang="ja"><head><meta charset="utf-8"><style>body{font:13px -apple-system,sans-serif}p{margin:0 0 12px}</style></head>
<body>
<p>Sleepless なら、ワンクリックで MacBook のふたを閉じたまま使い続けられます。画面は消えても、音楽、ダウンロード、バックグラウンドの処理、リモート接続はこれまでどおり動き続けます。</p>
<p>このインストーラは Sleepless をアプリケーションフォルダに入れ、管理者として実行できるシステムコマンドをひとつだけ許可します。MacBook のスリープ設定を切り替えるコマンドです。</p>
<p>スイッチをオフにする、アプリを終了するか閉じる、Mac を再起動する、またはバッテリー残量が 10% 以下になる——このいずれかで、いつものスリープ設定に戻ります。</p>
<p>どうぞお楽しみください！</p>
</body></html>
