<p>Sleepless를 사용하면 클릭 한 번으로 덮개를 닫은 상태에서도 MacBook이 계속 작동합니다. 화면은 꺼지지만 음악, 다운로드, 백그라운드 작업, 원격 연결은 평소처럼 계속됩니다!</p>
<p>이 설치 프로그램은 Sleepless를 응용 프로그램 폴더에 넣고, 관리자 권한으로 단 하나의 시스템 명령만 실행하도록 허용합니다. MacBook의 잠자기 설정을 제어하는 명령입니다.</p>
<p>스위치를 끄거나, 앱을 종료하거나 닫거나, Mac을 재시동하거나, 배터리가 10% 이하로 떨어지면 평소의 잠자기 설정이 바로 돌아옵니다.</p>
<p>즐겁게 사용하세요!</p>
